spring.application.name=reservation-service
server.port=8081

room.service.base-url=http://localhost:8080
room.service.connect-timeout-ms=3000
room.service.read-timeout-ms=3000
room.service.retry.max-attempts=3
room.service.retry.backoff-delay-ms=500

# Reservation Service owns only reservation_db. Room data is verified over REST.
spring.datasource.url=${RESERVATION_DB_URL:jdbc:postgresql://localhost:5434/reservation_db}
spring.datasource.username=${RESERVATION_DB_USERNAME:reservation_user}
spring.datasource.password=${RESERVATION_DB_PASSWORD:reservation_local_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:soa}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:soa-local-dev}
spring.rabbitmq.dynamic=true

reservation.messaging.topology.declare-on-startup=true

# Only the local web UI is allowed to call this API directly from a browser.
app.cors.allowed-origin=${WEB_UI_ORIGIN:http://localhost:5173}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
