spring.application.name=reservation-service-test

room.service.base-url=http://localhost:8080
room.service.connect-timeout-ms=3000
room.service.read-timeout-ms=3000
room.service.retry.max-attempts=3
room.service.retry.backoff-delay-ms=500

spring.datasource.url=jdbc:h2:mem:reservation_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=soa
spring.rabbitmq.password=soa-local-dev
spring.rabbitmq.dynamic=true

reservation.messaging.topology.declare-on-startup=false

# src/test/resources/application.properties shadows the main file during tests.
app.cors.allowed-origin=http://localhost:5173
