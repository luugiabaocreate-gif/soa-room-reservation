spring.application.name=ROOM-SERVICE
server.port=${SERVER_PORT:8080}

# Room Service owns only room_db. Reservation Service must use REST, never this database.
spring.datasource.url=${ROOM_DB_URL:jdbc:postgresql://localhost:5433/room_db}
spring.datasource.username=${ROOM_DB_USERNAME:room_user}
spring.datasource.password=${ROOM_DB_PASSWORD:room_local_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Only the web UI origin is allowed to call a Room API directly. In the TH7
# topology the browser should use API Gateway instead.
app.cors.allowed-origin=${WEB_UI_ORIGIN:http://localhost:5173}

# TH7: both Room instances use this same Service ID and register independently.
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${INSTANCE_ID:${server.port}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT is issued by auth-service. JWT_SECRET is required from the local .env loaded into PowerShell.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=soa-room-reservation-auth
security.jwt.audience=room-service
