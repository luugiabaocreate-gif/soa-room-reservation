spring.application.name=AUTH-SERVICE
server.port=${SERVER_PORT:8083}

# Auth Service owns only auth_db.
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5435/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:auth_user}
spring.datasource.password=${AUTH_DB_PASSWORD:auth_local_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.cors.allowed-origin=${WEB_UI_ORIGIN:http://localhost:5173}

# Required from local .env; never commit a real signing key.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=soa-room-reservation-auth
security.jwt.expiration-seconds=900
security.internal.reservation-client-id=${AUTH_SERVICE_CLIENT_ID:reservation-service}
security.internal.reservation-client-secret=${RESERVATION_SERVICE_CLIENT_SECRET}

# TH7: Auth has a stable Service ID and registers its physical instance with
# Eureka. Its callers resolve AUTH-SERVICE instead of a host:port literal.
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${INSTANCE_ID:${server.port}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
