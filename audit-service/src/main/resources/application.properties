spring.application.name=AUDIT-SERVICE
server.port=${SERVER_PORT:8082}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:soa}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:soa-local-dev}
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# TH7: Audit does not consume business REST APIs, but registers so operations
# can observe every independently deployable process in one registry.
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${INSTANCE_ID:${server.port}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
