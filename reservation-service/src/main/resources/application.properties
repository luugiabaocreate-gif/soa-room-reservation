spring.application.name=RESERVATION-SERVICE
server.port=${SERVER_PORT:8081}

# TH7 discovery defaults: callers use logical Service IDs. Direct URLs are
# still overrideable only for a controlled local diagnostic scenario.
room.service.base-url=${ROOM_SERVICE_BASE_URL:http://ROOM-SERVICE}
room.service.connect-timeout-ms=3000
room.service.read-timeout-ms=3000
room.service.retry.max-attempts=3
room.service.retry.backoff-delay-ms=500

auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://AUTH-SERVICE}
auth.service.connect-timeout-ms=3000
auth.service.read-timeout-ms=3000
auth.service.client-id=${AUTH_SERVICE_CLIENT_ID:reservation-service}
auth.service.client-secret=${RESERVATION_SERVICE_CLIENT_SECRET}

# Reservation Service owns only reservation_db. Room data is verified over REST.
spring.datasource.url=${RESERVATION_DB_URL:jdbc:postgresql://localhost:5434/reservation_db}
spring.datasource.username=${RESERVATION_DB_USERNAME:reservation_user}
spring.datasource.password=${RESERVATION_DB_PASSWORD:reservation_local_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:soa}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:soa-local-dev}
spring.rabbitmq.dynamic=true

reservation.messaging.topology.declare-on-startup=true

# Direct browser calls remain restricted in local development; the preferred
# browser entry point after TH7 is API Gateway.
app.cors.allowed-origin=${WEB_UI_ORIGIN:http://localhost:5173}

# TH7: Reservation resolves ROOM-SERVICE and AUTH-SERVICE through Eureka.
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${INSTANCE_ID:${server.port}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT is issued by auth-service. JWT_SECRET is required from the local .env loaded into PowerShell.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=soa-room-reservation-auth
security.jwt.audience=reservation-service
